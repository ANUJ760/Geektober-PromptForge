services:
  mongo:
    image: mongo:8.0
    container_name: promptforge_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - promptforge_net

  redis:
    image: redis:7-alpine
    container_name: promptforge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - promptforge_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: promptforge_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_URL=mongodb://mongo:27017/promptforge
      - REDIS_URL=redis://redis:6379
      - JWT_Secret_Key=promptforge_super_secure_production_secret_key_32chars
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_simKey}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-mock_secret_key}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-webhook_secret}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
    depends_on:
      - mongo
      - redis
    networks:
      - promptforge_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: promptforge_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api/v1
    depends_on:
      - server
    networks:
      - promptforge_net

volumes:
  mongo_data:
  redis_data:

networks:
  promptforge_net:
    driver: bridge
