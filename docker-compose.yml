services:
  mongo:
    image: mongo:8.0
    container_name: promptforge_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      promptforge_net:
        aliases:
          - mongo
          - promptforge_mongo
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: promptforge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      promptforge_net:
        aliases:
          - redis
          - promptforge_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: promptforge_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_URL=mongodb://mongo:27017/promptforge
      - REDIS_URL=redis://redis:6379
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - promptforge_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: promptforge_web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api/v1
    depends_on:
      - server
    networks:
      - promptforge_net

volumes:
  mongo_data:
  redis_data:

networks:
  promptforge_net:
    driver: bridge
